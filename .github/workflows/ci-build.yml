name: CI-build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options: [all, linux, mac-osx, windows]

# Build pushes, and pull requests only when they come from another repository
# (a same-repo PR is already built by its push).
jobs:
  linux:
    if: (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name) &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/configure-linux
      - run: cmake --build build --parallel
      - uses: ./.github/actions/run-tests

  linux-clang:
    if: (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name) &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/configure-linux
        with:
          configure_options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build --parallel
      - uses: ./.github/actions/run-tests

  mac-osx-arm:
    if: (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name) &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'mac-osx')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-mac-osx
        with:
          osx_arch: arm64
      - uses: ./.github/actions/run-tests

  windows-x64:
    if: (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name) &&
      (github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-windows
        with:
          platform: x64
          configurations: Release
      - uses: ./.github/actions/run-tests
