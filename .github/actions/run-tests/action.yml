name: run-tests
description: cross-platform action to run the Raptua tests

inputs:
  build_dir:
    required: false
    default: build
  configuration:
    description: CMake configuration (multi-config generators such as Visual Studio)
    required: false
    default: Release

runs:
  using: "composite"
  steps:
    # The repository contains no Raptor data, so only the data-free tests run
    # here (format decoders on synthetic data, Lua self-tests, booting to the
    # no-data screen). The [data] tests run locally when RAPTUA_DATA is set.
    - name: Run tests
      run: ctest --test-dir "${{inputs.build_dir}}" -C ${{inputs.configuration}} --output-on-failure
      shell: pwsh
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
